services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bizpeek
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run setup:env}
      POSTGRES_DB: bizpeek
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bizpeek_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizpeek -d bizpeek"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  bizpeek_postgres_data:
