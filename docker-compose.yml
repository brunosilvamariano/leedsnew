services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bizpeek
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run setup:env}
      POSTGRES_DB: bizpeek
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bizpeek_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizpeek -d bizpeek"]
      interval: 5s
      timeout: 5s
      retries: 10
  n8n:
    image: n8nio/n8n:2.6.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Configure N8N_ENCRYPTION_KEY no arquivo .env}
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      BIZPEEK_CALLBACK_SECRET: ${N8N_WEBHOOK_SECRET}
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
    volumes:
      - bizpeek_n8n_data:/home/node/.n8n
    depends_on:
      ollama:
        condition: service_started
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - bizpeek_ollama_data:/root/.ollama
volumes:
  bizpeek_postgres_data:
  bizpeek_n8n_data:
  bizpeek_ollama_data:
