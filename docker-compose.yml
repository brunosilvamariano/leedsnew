services:
  postgres:
    image: postgres:17-alpine
    container_name: prospect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prospect
      POSTGRES_PASSWORD: prospect
      POSTGRES_DB: prospect
    ports:
      - "5433:5432"
    volumes:
      - prospect_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospect -d prospect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prospect_postgres_data:
